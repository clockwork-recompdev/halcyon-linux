<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 130px; height: 136px; overflow: hidden; font-family: "Source Sans 3", "Segoe UI", sans-serif; cursor: default; }
  body.big { width: 266px; }
  .card { position: absolute; top: 2px; width: 126px; height: 130px; border-radius: 7px; overflow: hidden;
          background: linear-gradient(#ffffff, #e8f1f8); box-shadow: 0 2px 5px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.8);
          border: 1px solid #7f9bb1; box-sizing: border-box; }
  #day { left: 2px; } #month { left: 2px; display: none; } body.big #month { display: block; left: 138px; } body.big #day { display: block; }
  body.m:not(.big) #day { display: none; } body.m:not(.big) #month { display: block; }
  .head { height: 26px; line-height: 25px; text-align: center; color: #fff; font-size: 13px; font-weight: 600;
          background: linear-gradient(#78ccff, #2d86c9 55%, #1a69a8); text-shadow: 0 1px 1px rgba(0,0,0,.35);
          box-shadow: inset 0 1px 0 rgba(255,255,255,.55); position: relative; }
  .num { text-align: center; font-size: 62px; font-weight: 700; color: #1d3347; line-height: 70px; margin-top: 2px;
         text-shadow: 0 1px 0 #fff; }
  .sub { text-align: center; font-size: 13px; color: #47657f; }
  .nav { position: absolute; top: 0; width: 22px; height: 26px; cursor: pointer; color: #fff; font-size: 11px; }
  .nav:hover { background: rgba(255,255,255,.2); }
  #prev { left: 0; } #next { right: 0; }
  table { border-collapse: collapse; width: 118px; margin: 3px auto 0; font-size: 10px; text-align: center; color: #1d3347; }
  th { color: #6c8aa3; font-weight: 600; height: 13px; }
  td { height: 14px; border-radius: 3px; }
  td.out { color: #b5c4d0; }
  td.today { background: linear-gradient(#5dbaf5, #1e7fc4); color: #fff; font-weight: 700; }
  td.wknd { color: #3e7fb0; }
</style>
<script>
var shown = new Date(), MONTHS, DAYS;
function names() {
  MONTHS = []; DAYS = [];
  for (var i = 0; i < 12; i++) MONTHS.push(new Date(2020, i, 1).toLocaleDateString(undefined, { month: "long" }));
  for (i = 0; i < 7; i++) DAYS.push(new Date(2020, 10, 1 + i).toLocaleDateString(undefined, { weekday: "long" })); // Nov 1 2020 = Sunday
}
function render() {
  var t = new Date();
  document.getElementById("wd").textContent = DAYS[t.getDay()];
  document.getElementById("num").textContent = t.getDate();
  document.getElementById("my").textContent = MONTHS[t.getMonth()] + " " + t.getFullYear();
  document.getElementById("mt").textContent = MONTHS[shown.getMonth()].slice(0, 3) + " " + shown.getFullYear();
  var first = new Date(shown.getFullYear(), shown.getMonth(), 1), start = first.getDay();
  var html = "<tr>";
  for (var i = 0; i < 7; i++) html += "<th>" + DAYS[i].charAt(0) + "</th>";
  html += "</tr>";
  for (var r = 0; r < 6; r++) {
    html += "<tr>";
    for (var c = 0; c < 7; c++) {
      var d = new Date(shown.getFullYear(), shown.getMonth(), 1 + r * 7 + c - start), cls = [];
      if (d.getMonth() !== shown.getMonth()) cls.push("out");
      else if (c === 0 || c === 6) cls.push("wknd");
      if (d.toDateString() === t.toDateString()) cls.push("today");
      html += "<td class='" + cls.join(" ") + "'>" + d.getDate() + "</td>";
    }
    html += "</tr>";
  }
  document.getElementById("grid").innerHTML = html;
}
function move(n, e) { shown = new Date(shown.getFullYear(), shown.getMonth() + n, 1); render(); e.stopPropagation(); }
function flip() {
  if (document.body.classList.contains("big")) return;
  document.body.classList.toggle("m");
  shown = new Date();
  render();
}
function size() { document.body.className = System.Gadget.docked ? "" : "big"; render(); }
function init() {
  names();
  System.Gadget.onDock = size;
  System.Gadget.onUndock = size;
  size();
  var last = new Date().getDate();
  setInterval(function () { if (new Date().getDate() !== last) { last = new Date().getDate(); shown = new Date(); render(); } }, 30000);
}
</script>
</head>
<body onload="init()">
  <div class="card" id="day" onclick="flip()">
    <div class="head" id="wd"></div>
    <div class="num" id="num"></div>
    <div class="sub" id="my"></div>
  </div>
  <div class="card" id="month" onclick="flip()">
    <div class="head"><span class="nav" id="prev" onclick="move(-1, event)">◀</span><span id="mt"></span><span class="nav" id="next" onclick="move(1, event)">▶</span></div>
    <table id="grid"></table>
  </div>
</body>
</html>
