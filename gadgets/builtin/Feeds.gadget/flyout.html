<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 300px; font-family: "Source Sans 3", "Segoe UI", sans-serif; }
  .box { margin: 4px; padding: 10px 12px 12px; border-radius: 8px; background: linear-gradient(#ffffff, #edf3f8);
         border: 1px solid #8ea7bb; box-shadow: 0 3px 8px rgba(0,0,0,.45); color: #1c2b39; }
  #t { font-size: 15px; font-weight: 600; color: #15507d; }
  #d { font-size: 11px; color: #6b8296; margin: 3px 0 7px; }
  #b { font-size: 12.5px; line-height: 1.4; max-height: 220px; overflow: hidden; }
  #a { display: inline-block; margin-top: 9px; color: #1e7fc4; cursor: pointer; font-size: 12px; }
  #a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="box"><div id="t"></div><div id="d"></div><div id="b"></div><span id="a">Read the full story ›</span></div>
</body>
</html>
