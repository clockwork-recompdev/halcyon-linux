<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 132px; height: 92px; overflow: hidden; font-family: "Source Sans 3", "Segoe UI", sans-serif; cursor: default; }
  body.big { zoom: 1.6; }
  svg { position: absolute; left: 0; top: 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
</style>
<script>
var NS = "http://www.w3.org/2000/svg", dials = {};
function el(tag, a, p) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }

// A dial: 240-degree scale with ticks, a coloured "hot" zone, needle and percentage readout.
function dial(svg, id, cx, cy, r, label) {
  var g = el("g", {}, svg);
  el("circle", { cx: cx, cy: cy, r: r + 3, fill: "url(#rim)" }, g);
  el("circle", { cx: cx, cy: cy, r: r, fill: "url(#face)" }, g);
  for (var i = 0; i <= 20; i++) {
    var a = (-120 + i * 12) * Math.PI / 180, big = i % 5 === 0, r1 = r - (big ? 8 : 5), r2 = r - 2;
    el("line", { x1: cx + r1 * Math.sin(a), y1: cy - r1 * Math.cos(a), x2: cx + r2 * Math.sin(a), y2: cy - r2 * Math.cos(a),
                 stroke: i >= 16 ? "#ff6a4a" : "#8fd3ff", "stroke-width": big ? 1.6 : .8 }, g);
  }
  var pct = el("text", { x: cx, y: cy + r * .55, "text-anchor": "middle", "font-size": r * .34, "font-weight": 700, fill: "#eaf6ff" }, g);
  var lab = el("text", { x: cx, y: cy + r * .82, "text-anchor": "middle", "font-size": r * .22, fill: "#8fb6d3" }, g);
  lab.textContent = label;
  var needle = el("path", { d: "M " + (cx - 1.6) + " " + cy + " L " + cx + " " + (cy - r + 7) + " L " + (cx + 1.6) + " " + cy + " Z",
                            fill: "#ff5a3c" }, g);
  el("circle", { cx: cx, cy: cy, r: r * .12, fill: "url(#cap)" }, g);
  el("path", { d: "M " + (cx - r * .8) + " " + (cy - r * .2) + " A " + r * .85 + " " + r * .85 + " 0 0 1 " + (cx + r * .8) + " " + (cy - r * .2) +
               " Q " + cx + " " + (cy - r * .45) + " " + (cx - r * .8) + " " + (cy - r * .2) + " Z", fill: "#fff", opacity: .12 }, g);
  dials[id] = { needle: needle, pct: pct, cx: cx, cy: cy, value: 0, shown: 0 };
}
function set(id, v) { dials[id].value = Math.max(0, Math.min(100, v)); }
function animate() {
  for (var k in dials) {
    var d = dials[k];
    d.shown += (d.value - d.shown) * 0.25;
    d.needle.setAttribute("transform", "rotate(" + (-120 + d.shown * 2.4) + " " + d.cx + " " + d.cy + ")");
    d.pct.textContent = Math.round(d.value) + "%";
  }
}
function sample() {
  var c = System.Machine.CPUs, total = 0;
  for (var i = 0; i < c.count; i++) total += c.item(i).usagePercentage;
  set("cpu", c.count ? total / c.count : 0);
  var t = System.Machine.totalMemory, a = System.Machine.availableMemory;
  set("ram", t ? (t - a) * 100 / t : 0);
}
function size() { document.body.className = System.Gadget.docked ? "" : "big"; }
function init() {
  var svg = document.getElementById("s"), defs = el("defs", {}, svg);
  var rim = el("linearGradient", { id: "rim", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el("stop", { offset: 0, "stop-color": "#dfe8f0" }, rim); el("stop", { offset: 1, "stop-color": "#4d6175" }, rim);
  var face = el("radialGradient", { id: "face", cx: "50%", cy: "35%", r: "70%" }, defs);
  el("stop", { offset: 0, "stop-color": "#2f3d4d" }, face); el("stop", { offset: 1, "stop-color": "#0a0f14" }, face);
  var cap = el("radialGradient", { id: "cap", cx: "40%", cy: "35%", r: "70%" }, defs);
  el("stop", { offset: 0, "stop-color": "#fff" }, cap); el("stop", { offset: 1, "stop-color": "#7d8c99" }, cap);
  dial(svg, "cpu", 46, 46, 40, "CPU");
  dial(svg, "ram", 104, 58, 25, "Memory");
  System.Gadget.onDock = size;
  System.Gadget.onUndock = size;
  size();
  sample();
  setInterval(sample, 1000);
  setInterval(animate, 50);
}
</script>
</head>
<body onload="init()"><svg id="s" width="132" height="92" viewBox="0 0 132 92"></svg></body>
</html>
