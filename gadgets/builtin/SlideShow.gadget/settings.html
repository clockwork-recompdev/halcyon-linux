<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 300px; height: 190px; padding: 14px 16px; box-sizing: border-box; font: 13px "Source Sans 3", "Segoe UI", sans-serif; color: #1c2b39; }
  label { display: block; margin: 8px 0 3px; }
  .row { display: flex; gap: 6px; }
  #folder { flex: 1; padding: 3px 5px; font: inherit; }
  select { font: inherit; }
</style>
<script>
var S = System.Gadget.Settings;
function browse() {
  var f = System.Shell.chooseFolder("Choose a folder of pictures", 0);
  if (f) document.getElementById("folder").value = f.path;
}
function init() {
  document.getElementById("folder").value = S.readString("folder") || decodeURI(System.Shell.knownFolderPath("Pictures").replace(/^.*\/fs/, ""));
  document.getElementById("iv").value = S.readString("interval") || "10";
  document.getElementById("sh").checked = S.read("shuffle") !== false;
  System.Gadget.onSettingsClosing = function (e) {
    if (e.closeAction == e.Action.commit) {
      S.writeString("folder", document.getElementById("folder").value);
      S.writeString("interval", document.getElementById("iv").value);
      S.write("shuffle", document.getElementById("sh").checked);
    }
  };
}
</script>
</head>
<body onload="init()">
  <label for="folder">Folder</label>
  <div class="row"><input type="text" id="folder"><button onclick="browse()">Browse…</button></div>
  <label for="iv">Show each picture for</label>
  <select id="iv"><option value="5">5 seconds</option><option value="10">10 seconds</option><option value="15">15 seconds</option>
    <option value="30">30 seconds</option><option value="60">1 minute</option><option value="300">5 minutes</option></select>
  <label><input type="checkbox" id="sh"> Shuffle pictures</label>
</body>
</html>
